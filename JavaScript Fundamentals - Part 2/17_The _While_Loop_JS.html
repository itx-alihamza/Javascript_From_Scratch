<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        "use strict";
        //While Loop:
        //While loop keeps running while the condition is TRUE
        //While loop can be used when we don't know how many times the loop should run

        let rep = 1;
        while (rep <= 10) {
            console.log('Lifting weight repetition ${rep}.');
            rep++;
        }

        let dice = Math.random() * 6;
        console.log(dice);

    </script>
</head>

<body>
    <h1>While Loop</h1>
</body>

</html>
