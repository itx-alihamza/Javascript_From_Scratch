<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        "use strict";
        const age = 15;

        if (age >= 18) console.log('Hurry! you can start driving licence 🚗');
        else {
            const yearLeft = 18 - age;
            console.log(`You are too young. Wait another ${yearLeft} years.`);
        }

        const birthYear = 2012;
        let century;
        if (birthYear >= 2000) century = 21;
        else century = 20;
        console.log(century);
    </script>
</head>

<body>
    <h1>Taking Decision if else Statements</h1>
</body>

</html>
