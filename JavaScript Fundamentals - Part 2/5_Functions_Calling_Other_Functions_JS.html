<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Functions Calling Other Functions:
        //We can call a function inside another function
        //We can call a function inside a function that is inside another function
        //We can call a function inside a function that is inside another function that is inside another function

        const cutPieces = function (fruit) {
            return fruit * 4;
        }
        const fruitProcessor = function (apples, oranges) {
            let applePieces = cutPieces(apples);
            let orangesPieces = cutPieces(oranges);
            const juice = `Juice with ${applePieces} apples and ${orangesPieces} oranges.`;
            return juice;
        }

        console.log(fruitProcessor(2, 3));
    </script>
</head>

<body>
    <h1>Functions Calling Other Functions</h1>
</body>

</html>
