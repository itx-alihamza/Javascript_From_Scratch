<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        "use strict";
        //Arrays Review
        const simpArr = [
            'Jonas',
            'Schemendas',
            23 - 34,
            'teacher',
            ['Micheal', 'Peter', 23 + 23]
        ];
        console.log(simpArr);//Displaying whole array
        console.log(simpArr[4][1]);//Displaying specific element from array.

        //Whats is an Object?
        //Objects are complex data types that allow us to store multiple different type values in a single variable.
        //In Objects the order of the values does not matter.
        //Objects are used to store key-value pairs.
        //Objects are used to represent real-world entities.

        //Note:
        //We use array for more ordered data and 
        //Objects for more unstructured data.

        //This is the object literal(writing down) syntax.
        //This is the most common way to create objects.
        const jonas = {
            //All these keys are called properties and the values are called values.
            firstName: 'Jnas',
            lastName: 'Schedtmann',
            age: 2037 - 1991,
            job: 'teacher',
            friends: ['Micheal', 'Peter', 'Steven']
        }
    </script>
</head>

<body>
    <h1>Introduction to Objects</h1>
</body>

</html>
