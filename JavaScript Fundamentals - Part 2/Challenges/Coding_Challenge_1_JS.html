        /*Coding Challenge #1
        // Back to the two gymnastics teams, the Dolphins and the Koalas! There is a new
        // gymnastics discipline, which works differently.
        // Each team competes 3 times, and then the average of the 3 scores is calculated (so
        // one average score per team).
        // A team only wins if it has at least double the average score of the other team.
        // Otherwise, no team wins!
        // Your tasks:
        // 1. Create an arrow function 'calcAverage' to calculate the average of 3 scores
        // 2. Use the function to calculate the average for both teams
        // 3. Create a function 'checkWinner' that takes the average score of each team
        // as parameters ('avgDolhins' and 'avgKoalas'), and then logs the winner
        // to the console, together with the victory points, according to the rule above.
        // Example: "Koalas win (30 vs. 13)"
        // 4. Use the 'checkWinner' function to determine the winner for both Data 1 and
        // Data 2
        // 5. Ignore draws this time
        // Test data:
        // § Data 1: Dolphins score 44, 23 and 71. Koalas score 65, 54 and 49
        // § Data 2: Dolphins score 85, 54 and 41. Koalas score 23, 34 and 27
        // Hints:
        // § To calculate average of 3 values, add them all together and divide by 3
        // § To check if number A is at least double number B, check for A >= 2 * B.
        // Apply this to the team's average scores �*/

        //Function to find the average of three matches scores.
        function calAverage(score1, score2, score3) {
            return (score1 + score2 + score3) / 3;
        }
        //Funcition to declare the winner
        function checkWinner(avgDolhins, avgKaalas) {
            let vicPoints;
            if (avgDolhins > avgKaalas * 2) {
                console.log(`Team Dolphin is the Winner (${Number(avgDolhins.toFixed(0))} vs ${Number(avgKaalas.toFixed(0))})`);
            }
            else {
                vicPoints = avgKaalas - avgDolhins;
                console.log(`Team Kaalas is the Winner (${Number(avgKaalas.toFixed(0))} vs ${Number(avgDolhins.toFixed(0))})`);
            }
        }
        //Data 1
        let dolphinMatch1 = 96, dolphinMatch2 = 108, dolphinMatch3 = 89;
        let kaalasMatch1 = 88, kaalasMatch2 = 91, kaalasMatch3 = 110;

        //To check the average of three matches score for both teams Dolphin and Kkaalas
        let avgDolhinsScore1 = calAverage(dolphinMatch1, dolphinMatch2, dolphinMatch3);
        let avgKaalasScore1 = calAverage(kaalasMatch1, kaalasMatch2, kaalasMatch3);
        //To declare the winner 

        //Data 2
        dolphinMatch1 = 85, dolphinMatch2 = 54, dolphinMatch3 = 41;
        kaalasMatch1 = 23, kaalasMatch2 = 34, kaalasMatch3 = 27;

        //To check the average of three matches score for both teams Dolphin and Kkaalas
        let avgDolhinsScore2 = calAverage(dolphinMatch1, dolphinMatch2, dolphinMatch3);
        let avgKaalasScore2 = calAverage(kaalasMatch1, kaalasMatch2, kaalasMatch3);

        checkWinner(avgDolhinsScore1, avgKaalasScore1);//Data 1 result
        checkWinner(avgDolhinsScore2, avgKaalasScore2);//Data 2 result




    </script>
