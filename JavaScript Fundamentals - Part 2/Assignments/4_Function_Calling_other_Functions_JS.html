<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*LECTURE: Functions Calling Other Functions
        1. Create a function called 'describePopulation'. Use the function type you
        like the most. This function takes in two arguments: 'country' and
        'population', and returns a string like this: 'China has 1441 million people,
        which is about 18.2% of the world.'
        2. To calculate the percentage, 'describePopulation' call the
        'percentageOfWorld1' you created earlier
        3. Call 'describePopulation' with data for 3 countries of your choice*/
        let calPer = function (chinaPopulaiton) { return chinaPopulaiton / 77000000000 * 100 }

        let describePopulation = function (country, population) { console.log(`${country} has ${population} million people, which is about ${calPer(population)}% of the world.`) }

        describePopulation('Pakistan', 220000000);
        describePopulation('China', 14410000000);
        describePopulation('America', 3330000000);
    </script>
</head>

<body>
    <h1>LECTURE: Functions Calling Other Functions</h1>
</body>
