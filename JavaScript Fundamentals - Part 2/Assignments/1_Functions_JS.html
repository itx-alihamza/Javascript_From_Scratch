<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*LECTURE: Functions
        1. Write a function called 'describeCountry' which takes three parameters:
        'country', 'population' and 'capitalCity'. Based on this input, the
        function returns a string with this format: 'Finland has 6 million people and its
        capital city is Helsinki'
        2. Call this function 3 times, with input data for 3 different countries. Store the
        returned values in 3 different variables, and log them to the console*/
        const describeCountry = (country, population, capitalCity) => console.log(`${country} has ${population} million people and its capital city is ${capitalCity}`);
        describeCountry('Pakistan', 220000000, 'Islamabad');
        describeCountry('Finland', 330000000, 'Helsinki');
        describeCountry('America', 3330000000, 'Washington, D.C.');
    </script>
</head>

<body>
    <h1>LECTURE: Functions</h1>
</body>
