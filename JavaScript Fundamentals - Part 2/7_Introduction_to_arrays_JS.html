<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Arrays in JS:
        //Arrays are a collection of elements.
        //Arrays are used to store multiple values in a single variable.
        //Arrays are created using square brackets [].
        const friends = ['Michael', 'Steven', 'Peter'];
        console.log(friends);

        //Another way to create an array
        //Using the Array constructor
        //Here new keyword is used to create an array.
        const years = new Array(1991, 1984, 2008, 2020);

        //Accessing elements in an array
        console.log(friends[0]);
        console.log(friends[2]);

        //To find the length of an array
        console.log(friends.length);
        //To find the last element of an array we can use the length property and subtract 1 from it 
        //if length is e.g 10 then the last element will be at index 9 which is 10-1=9
        console.log(friends[friends.length - 1]);

        //Even though we have declared the array as a const we can still change the elements of the array
        //cuz we are not changing the array itself but the elements of the array.
        //e.g:
        //friends = ['Bob', 'Alice']; //This will give an error cuz we are trying to change the array itself.
        friends[2] = 'Jay';
        console.log(friends);

        //We can also have different data types in an array
        const jonas = ['jonas', 'Ali', 2034 - 1991, 'teacher', friends];
        console.log(jonas);
        console.log(jonas.length);

        //Exercise
        const calcAge = function (birthYear) {
            return 2037 - birthYear;
        }
        const yer = [1990, 1967, 2002, 2010, 2018];

        //This will give an error cuz we are passing an array to the function which is expecting a number.
        console.log(calcAge(yer));
        const age1 = calcAge(yer[0]);
        const age2 = calcAge(yer[1]);
        const age3 = calcAge(yer[yer.length - 1]);
        console.log(age1, age2, age3);

        const ages = [calcAge(yer[0]), calcAge(yer[1]), calcAge(yer[yer.length - 1])];
        console.log(ages);

    </script>
</head>

<body>
    <h1>Introduction to arrays</h1>
</body>

</html>
